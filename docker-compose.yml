services:
  app:
    build:
      context: ./docker
    container_name: aktuality-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    # The bind-mount overwrites image permissions, so writable/ is opened on start.
    command: >
      bash -c "mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar
      && chmod -R 777 writable
      && apache2-foreground"

  db:
    image: mariadb:10.11
    container_name: aktuality-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aktuality
      MYSQL_USER: aktuality
      MYSQL_PASSWORD: aktuality
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer:4
    container_name: aktuality-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data:
